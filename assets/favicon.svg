<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#cyan-blue)" stroke-width="2"/>
  <!-- DR Monogram Letters -->
  <g fill="none" stroke="url(#cyan-blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- D Path -->
    <path d="M18 19 V45 M18 19 H28 C34 19 38 23 38 32 C38 41 34 45 28 45 H18" />
    <!-- R Path nested & connected -->
    <path d="M33 31 H42 C46 31 48 33 48 37 C48 40 45 42 41 42 H34 M41 42 L48 49" />
  </g>
</svg>
